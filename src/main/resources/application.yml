spring:
  application:
    name: smart-healthcare
  config:
    import: optional:file:./.env[.properties]
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:smart_healthcare}
    username: ${POSTGRES_USER:healthcare}
    password: ${POSTGRES_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        cache:
          use_second_level_cache: ${DOCTOR_CACHE_ENABLED:true}
          use_query_cache: false
        jdbc:
          time_zone: UTC
  data:
    mongodb:
      host: ${MONGO_HOST:localhost}
      port: ${MONGO_PORT:27017}
      database: ${MONGO_DATABASE:smart_healthcare}
      username: ${MONGO_USERNAME:healthcare}
      password: ${MONGO_PASSWORD}
      authentication-database: admin
      auto-index-creation: true
  jackson:
    time-zone: UTC

app:
  chatbot:
    mode: ${CHATBOT_MODE:stub}
    service-url: ${CHATBOT_SERVICE_URL:http://127.0.0.1:8090}
    service-key: ${CHATBOT_SERVICE_KEY:}
  cache:
    doctors:
      max-entries: ${DOCTOR_CACHE_MAX_ENTRIES:1000}
      ttl-seconds: ${DOCTOR_CACHE_TTL_SECONDS:300}
  bootstrap:
    admin:
      enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
      email: ${BOOTSTRAP_ADMIN_EMAIL:}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:}

logging:
  level:
    healthcare.appointments: INFO
    healthcare.prescriptions: INFO
    healthcare.cache: INFO

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
